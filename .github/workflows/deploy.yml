name: Deploy

# Deploys only what CI has passed on main (SPEC 3.10: no deploy before the tests pass).
# The demo deploy joins here, before the real one, in stage 9.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrate D1 and deploy the Worker
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # CI runs can finish out of order; an older commit must never land on top of a newer one.
      - name: Skip if main has moved on
        id: latest
        run: |
          latest=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$latest" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "main is at $latest; its own run deploys it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.latest.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
      - if: steps.latest.outputs.skip != 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.latest.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile
      # Migrations run before the new code, so they must be expand-only (SYSTEM §8).
      - if: steps.latest.outputs.skip != 'true'
        run: pnpm --filter @memory-garden/web exec wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.latest.outputs.skip != 'true'
        run: pnpm --filter @memory-garden/web run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
